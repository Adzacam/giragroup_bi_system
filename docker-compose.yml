services:
  # 1. Base de Datos de Catálogos de Referencia (3NF) - AISLADA
  catalog_db:
    build:
      context: .
      dockerfile: infrastructure/docker/catalog_db.Dockerfile
    container_name: giragroup_catalog_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: giragroup_catalog_db
      POSTGRES_USER: giragroup_user
      POSTGRES_PASSWORD: giragroup_secret_2026
    ports:
      - "127.0.0.1:5433:5432" # Puerto 5433 solo en localhost
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giragroup_user -d giragroup_catalog_db"]
      interval: 5s
      retries: 5

  # 2. Base de Datos Data Warehouse (Esquema Constelación)
  db:
    image: postgres:16-alpine
    container_name: giragroup_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: giragroup_db
      POSTGRES_USER: giragroup_user
      POSTGRES_PASSWORD: giragroup_secret_2026
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giragroup_user -d giragroup_db"]
      interval: 5s
      retries: 5

  # 3. API Gateway Nginx (Puerto 80 / 8080 en host)
  gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/gateway.Dockerfile
    container_name: giragroup_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - auth-service
      - notifications-service
      - audit-service
      - web

  # 4. Monolito Modular — BETO Core (DataOps, Pipeline, Catálogos, Riesgos, KPIs, Forecast)
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: giragroup_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      STANDALONE_MONOLITH: "false"
    # RNF-03: varios workers para atender concurrencia (un solo proceso con --reload saturaba con 50 usuarios).
    # API_RELOAD=1 vuelve al modo desarrollo con recarga automática.
    command: >
      sh -c 'if [ "$${API_RELOAD:-0}" = "1" ];
             then exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload;
             else exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers $${API_WORKERS:-4}; fi'
    depends_on:
      db:
        condition: service_healthy
      catalog_db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./pipeline:/app/pipeline
      - ./uploads:/app/uploads

  # 5. Microservicio Auth & IAM (Puerto 8001 aislado en red interna Docker)
  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/auth-service.Dockerfile
    container_name: giragroup_auth_svc
    restart: unless-stopped
    expose:
      - "8001"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/auth-service:/app
      - ./shared:/app/shared

  # 6. Microservicio Notifications & WebSockets (Puerto 8002 aislado en red interna Docker)
  notifications-service:
    build:
      context: .
      dockerfile: infrastructure/docker/notifications-service.Dockerfile
    container_name: giragroup_notifications_svc
    restart: unless-stopped
    expose:
      - "8002"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/notifications-service:/app
      - ./shared:/app/shared

  # 7. Microservicio Audit & Observability (Puerto 8004 aislado en red interna Docker)
  audit-service:
    build:
      context: .
      dockerfile: infrastructure/docker/audit-service.Dockerfile
    container_name: giragroup_audit_svc
    restart: unless-stopped
    expose:
      - "8004"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/audit-service:/app
      - ./shared:/app/shared

  # 8. Pipeline BETO NER Motor de Inferencia
  pipeline:
    build:
      context: .
      dockerfile: infrastructure/docker/pipeline.Dockerfile
    container_name: giragroup_pipeline
    restart: unless-stopped
    env_file: .env
    environment:
      # Hilos de PyTorch: sin límite usa los 24 núcleos del host y cada forward tarda ~1 s
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-8}
    depends_on:
      db:
        condition: service_healthy
      catalog_db:
        condition: service_healthy
    volumes:
      - ./pipeline:/app/pipeline
      - ./backend:/app/backend
      - ./tests:/app/tests
      - ./uploads:/app/uploads
      - ./db:/app/db
      - ./output:/app/output
    expose:
      - "8006"
    command: python -m pipeline.semantic.inference_server --host 0.0.0.0 --port 8006

  # 11. Frontend Web SPA React 18 + Vite
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: giragroup_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      CI: "true"
      VITE_API_TARGET: "http://gateway:80"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: sh -c "pnpm install && pnpm run dev --host"

volumes:
  catalog_postgres_data:
  postgres_data:
  web_node_modules: