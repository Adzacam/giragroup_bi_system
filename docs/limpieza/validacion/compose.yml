name: giragroup_limpieza_validacion
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: giragroup_db
      POSTGRES_USER: giragroup_user
      POSTGRES_PASSWORD: limpieza_solo_validacion
    ports:
      - "127.0.0.1:55434:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=1073741824
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giragroup_user -d giragroup_db"]
      interval: 2s
      timeout: 3s
      retries: 30
  catalog_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: giragroup_catalog_db
      POSTGRES_USER: giragroup_user
      POSTGRES_PASSWORD: limpieza_solo_validacion
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=536870912
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giragroup_user -d giragroup_catalog_db"]
      interval: 2s
      timeout: 3s
      retries: 30
