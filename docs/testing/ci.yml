name: CI Pipeline & Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  APP_ENV: test
  EMAIL_BACKEND: console
  ENVIRONMENT: test
  SECRET_KEY: test_secret_key_ci_environment_github_actions
  ALGORITHM: HS256

jobs:
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run Flake8 Syntax Check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,node_modules,backend/tests_root

  unit-and-integration-tests:
    name: Unit & Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint-and-format

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: giragroup_db_test
          POSTGRES_USER: giragroup_user
          POSTGRES_PASSWORD: giragroup_secret_2026
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      catalog_postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: giragroup_catalog_db_test
          POSTGRES_USER: giragroup_user
          POSTGRES_PASSWORD: giragroup_secret_2026
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r pipeline/requirements.txt
          pip install pytest pytest-cov httpx requests

      - name: Initialize DB Schemas
        env:
          PGPASSWORD: giragroup_secret_2026
        run: |
          psql -h localhost -p 5434 -U giragroup_user -d giragroup_db_test -f db/schema.sql
          psql -h localhost -p 5433 -U giragroup_user -d giragroup_catalog_db_test -f db/catalogos_3nf_schema.sql
          psql -h localhost -p 5433 -U giragroup_user -d giragroup_catalog_db_test -f db/catalogos_3nf_seed.sql

      - name: Run Test Suite with Coverage Gate (Threshold >= 75%)
        env:
          DATABASE_URL: postgresql+psycopg2://giragroup_user:giragroup_secret_2026@localhost:5434/giragroup_db_test
          CATALOG_DATABASE_URL: postgresql+psycopg2://giragroup_user:giragroup_secret_2026@localhost:5433/giragroup_catalog_db_test
        run: |
          pytest tests/sprint1/ tests/sprint2/ tests/sprint3/ tests/sprint4/ \
            --cov=pipeline --cov=backend/services \
            --cov-report=term-missing \
            --cov-fail-under=75
